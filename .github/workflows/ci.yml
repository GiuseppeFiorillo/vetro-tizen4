name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nu7100-host-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned host fixture toolchain
        run: docker build -t vetro-nu7100-fixtures kant-m2-root/nu7100
      - name: Run offline fixtures without firmware or device access
        run: |
          mkdir -p "$RUNNER_TEMP/nu7100-fixtures"
          mkdir -p "$GITHUB_WORKSPACE/kant-m2-root/nu7100/out"
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE/kant-m2-root/nu7100,target=/work,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/nu7100-fixtures,target=/work/out" \
            vetro-nu7100-fixtures sh tools/check-fixtures.sh
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Root boot-hook and supervisor tests
        run: ./kant-m2-root/check.sh
      - name: Standalone recovery marker fixtures
        run: node --test kant-m2-root/tests/standalone-recovery.test.cjs
      - name: Tizen 4 chain tests
        run: node --test chain/tests/*.test.cjs
      - name: Application tests
        run: node app/tests/run.cjs
      - name: Integration fixtures
        run: node rooting/tests/run.cjs
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Native launcher checks
        run: dotnet run -c Release --project dock/tests
      - name: Diagnostic parser tests
        run: python3 .github/scripts/test_parse_log.py
      - name: Release hygiene and architecture
        run: python3 .github/scripts/audit_release.py
